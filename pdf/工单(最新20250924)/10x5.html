<!DOCTYPE html>

<head>

  <title>生产工单10*5</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font: 400 20px/1 'PingFang SC', 'Microsoft Yahei', sans-serif;
    }

    .page {
      page-break-after: always;
      width: 500px;
      height: 250px;
      margin: 0 auto;
    }

    .wrapper,
    table,
    tr,
    td,
    th,
    tbody,
    thead,
    tfoot {
      page-break-inside: avoid !important;
    }

    .content-item {
      width: 500px;
      height: 250px;
    }

    .relative {
      position: relative;
    }

    .nowrap {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .red {
      color: rgb(245, 63, 63);
    }

    .left {
      position: absolute;
      top: 0;
      left: 0;
    }

    .left img {
      width: 200px;
      height: 200px;
    }

    .left .tag {
      display: inline-block;
      font-size: 12px;
      line-height: 16px;
      padding: 0 3px;
      background-color: rgb(245, 63, 63);
      color: #fff;
      position: absolute;
      top: 10px;
      left: 0;
    }

    .left .tag.bg_blue {
      background-color: rgb(0, 81, 248);
    }

    .left .tag.bg_orange {
      background-color: rgb(254, 152, 32);
    }

    .left .tag.gray {
      top: 32px;
    }

    .left .tag.biao {
      left: auto;
      right: 0;
      background-color: #fff;
      border: 1px solid #0453F3;
      color: #0453F3;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      padding: 0;
      text-align: center;
      font-weight: 500;
    }

    .left .tag.bu {
      top: 77px;
      left: -26px;

    .left .tag.bu img {
      width: 70px;
      height: 70px;

    .left .left_bottom {
      position: absolute;
      top: auto;
      bottom: 10px;
    }

    .left .left_bottom_tag {
      line-height: 16px;
      font-size: 12px;
      margin-top: 3px;
      padding: 0 3px;
      color: #fff;
      text-align: center;
    }

    .left .left_bottom_tag.urgent {
      background-color: rgb(245, 63, 63);
    }

    .left .left_bottom_tag.y2 {
      background-color: rgb(46, 116, 255);
    }

    .right {
      width: 300px;
      padding-left: 200px;
    }

    .part-1 {
      position: relative;
      font-size: 17px;
      padding-top: 6px;
      padding-bottom: 3px;
      border-bottom: 1px solid #1D2129;
    }

    .part-1 .type {
      display: inline-block;
      min-width: 15px;
      height: 15px;
      box-sizing: border-box;
      position: relative;
    }

    .part-1 svg {
      position: absolute;
      top: 0;
      left: 0;
    }

    .part-1 .name {
      display: inline-block;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .part-1 .platform {
      position: absolute;
      top: 6px;
      right: 0;

    }

    .part-2 {
      width: 100%;
      height: 168px;
      padding-top: 3px;
      position: relative;
      border-bottom: 1px solid #1D2129;
    }

    .part-2 .text-info {

      padding-right: 140px;

    .part-2 .date {
      display: inline-block;
      font-size: 25px;
      height: 27px;
      line-height: 27px;
      background: #F53F3F;
      color: #fff;

      margin-top: 3px;

    .part-2 .cz-info>div {

    .part-2 .item-total {

    .part-2 .total {

    .qr-code {

      text-align: center;

      top: 3px;
      right: 0;

    }

    .qr-code img {
      width: 140px;
      height: 140px;
    }

    .time-info {
      width: 105px;

      top: 0;
      left: 0;
    }

    .time {
      display: block;
      width: 105px;
      height: 22px;
      line-height: 22px;
      font-size: 20px;
      background-color: rgb(102, 102, 102);
      color: #fff;
      text-align: center;

      width: 150px;
      font-size: 25px;

    .time.week4 {

    .time.week5 {

    .time.week6 {

    .time.week2.even {

    .time.week3.even {

    }

    .time.week4.even {
      background-color: rgb(29, 149, 63);
    }

    .time.week5.even {
      background-color: rgb(16, 43, 106);
    }

    .time.week6.even {
      background-color: rgb(65, 20, 69);
    }

    .time.week7.even {
      background-color: rgb(62, 65, 69);
    }

    .detail-b {
      padding-left: 110px;
      line-height: 22px;
    }

    .detail-b .dt-1 {
      display: inline-block;
      min-width: 115px;
    }

    .detail-b .dt-rt {
      position: absolute;
      top: 0;
      right: 10px;
    }

    .detail-b .dt-6 {
      display: inline-block;
      min-width: 60px;
      line-height: 22px;
      padding: 0 12px;
      text-align: center;
    }

</head>
