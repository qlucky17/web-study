<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生产工单10*5</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font: 400 20px/1 'PingFang SC', 'Microsoft Yahei', sans-serif;
    }

    .page {
      page-break-after: always;
      width: 500px;
      height: 250px;
      margin: 0 auto;
      border: 1px solid red;
    }

    .wrapper,
    table,
    tr,
    td,
    th,
    tbody,
    thead,
    tfoot {
      page-break-inside: avoid !important;
    }

    .content-item {
      width: 500px;
      height: 250px;
    }

    .relative {
      position: relative;
    }

    .nowrap {
      overflow: hidden;
      white-space: nowrap;
    }

    .red {
      color: rgb(245, 63, 63);
    }

    .left {
      position: absolute;
      top: 0;
      left: 0;
    }

    .left img {
      width: 200px;
      height: 200px;
    }

    .left .tag {
      display: inline-block;
      font-size: 12px;
      line-height: 16px;
      padding: 0 3px;
      background-color: rgb(245, 63, 63);
      color: #fff;
      position: absolute;
      top: 10px;
      left: 0;
    }

    .left .tag.tag2 {
      top: 28px;
    }

    .left .tag.urgent {
      top: auto;
      bottom: 10px;
    }

    .left .tag.biao {
      left: auto;
      right: 0;
      background-color: #fff;
      border: 1px solid #0453F3;
      color: #0453F3;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      padding: 0;
      text-align: center;
      font-weight: 500;
    }

    .right {
      width: 300px;
      padding-left: 200px;
    }

    .part-1 {
      position: relative;
      font-size: 17px;
      padding-top: 10px;
      border-bottom: 1px solid #1D2129;
    }

    .part-1 .type {
      display: inline-block;
      min-width: 15px;
      height: 15px;
      box-sizing: border-box;
      position: relative;
    }

    .part-1 svg {
      position: absolute;
      top: 0;
      left: 0;
    }

    .part-1 .name {
      display: inline-block;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .part-1 .platform {
      position: absolute;
      top: 10px;
      right: 0;
      font-weight: 600;
    }

    .part-2 {
      width: 100%;
      height: 169px;
      position: relative;
      border-bottom: 1px solid #1D2129;
    }

    .part-2 .text-info {
      padding-left: 5px;
      padding-right: 140px;
    }

    .part-2 .date {
      display: inline-block;
      font-size: 25px;
      height: 27px;
      line-height: 27px;
      background: #F53F3F;
      color: #fff;
      padding: 0 7px;
      margin-top: 3px;
    }

    .part-2 .cz-info>div {
      margin-top: 5px;
    }

    .part-2 .item-total {
      margin-top: 10px;
    }

    .part-2 .total {
      font-size: 27px;
      margin-top: 5px;
    }

    .qr-code {
      width: 140px;
      text-align: center;
      position: absolute;
      top: 0;
      right: 0;
      font-size: 23px;
    }

    .qr-code img {
      width: 140px;
      height: 140px;
    }

    .time-info {
      width: 85px;
      position: absolute;
      top: 0;
      left: 0;
    }

    .time {
      display: inline-block;
      width: 85px;
      height: 22px;
      line-height: 22px;
      font-size: 20px;
      color: #fff;
      text-align: center;
    }

    .time.time1 {
      background-color: #FF6D00;
    }

    .time.time2 {
      background-color: #666666;
    }

    .detail-b {
      padding-left: 90px;
    }

    .detail-b .dt-1 {
      display: inline-block;
      min-width: 115px;
    }

    .detail-b .dt-rt {
      float: right;
      padding-right: 10px;
    }

    .detail-b .dt-6 {
      display: inline-block;
      line-height: 22px;
      background: #FF1F31;
      color: #fff;
      padding: 0 12px;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="wrapper">
      <div class="content-item">
        <div class="relative">
          <div class="left">
            <img src="商品图.jpg" />
            <span class="tag">1/3P</span>
            <span class="tag tag2">xxx</span>
            <span class="tag urgent">急</span>
            <span class="tag biao">标</span>
          </div>
          <div class="right">
            <div class="part-1 nowrap">
              <span>12H</span>
              <span class="type">
                <svg width="15" height="15" class="type-0">
                  <circle cx="7.5" cy="7.5" r="7.5" fill="#000"></circle>
                </svg>
                <!-- <svg width="15" height="12" class="type-1">
                  <polygon points="7.5,0 15,12 0,12" style="fill:#F53F3F;" />
                </svg> -->
                <!-- <svg width="15" height="15" class="type-2">
                  <rect x="0" y="0" rx="0" ry="0" width="15" height="15" style="fill:#000;" />
                </svg> -->
              </span>
              <span>10101</span>
              <span class="name">商户名称</span>
              <span class="platform">FBA</span>
            </div>
            <div class="part-2">
              <div class="text-info">
                <div class="date">08-28-013</div>
                <div class="cz-info">
                  <div>1000M-AA</div>
                  <div>红色</div>
                  <div>单码</div>
                </div>
                <div class="item-total">第1项-<span class="red">项<b>1000</b>件</span></div>
                <div class="total">总: 2000件</div>
              </div>
              <div class="qr-code">
                <img src="二维码.jpg" />
                <div>AAAAAA-1</div>
              </div>
            </div>
          </div>
        </div>
        <div class="relative">
          <div class="time-info">
            <div class="time time1">28-08</div>
            <div class="time time2">28-09</div>
          </div>
          <div class="detail-b">
            <div>
              <span class="dt-1">*05543</span>
              <span class="dt-2">778173642530</span>
              <span class="dt-rt">*01056</span>
            </div>
            <div>
              <span class="dt-4">ZxIshop_#NVZRA5Y</span>
              <span class="dt-rt">
                <span class="dt-5">A01</span>
                <span class="dt-6">0USPS</span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
</body>

</html>
