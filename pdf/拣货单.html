<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拣货单</title>
  <style>
    html, body{
      margin:0; 
      padding:0;
      font:400 14px/1.5 'PingFang SC','Microsoft Yahei',sans-serif;
      color: #1D2129;
    }
    .page{
      width: 794px;
      margin: 0 auto;
    }
    .wrapper{
      padding: 16px;
    }
    .header{
      font-size: 18px;
    }
    .ml16{
      margin-left: 16px;
    }
    table{
      width:100%;
      border-collapse:collapse;
      border-spacing:0;
      margin-top:12px;
    }
    table th{
      background: #F2F3F5;
    }
    table th, table td{
      border: 1px solid #C9CDD4;
      padding: 12px;
      text-align: left;
    }
    .footer{
      font-size: 16px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wrapper">
      <div class="header">
        <span>出库单号：XXXXXX</span>
        <span class="ml16">出库类型：波次出库</span>
        <span class="ml16">波次号：00000001</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>货品SKU ID「货品SKU」</th>
            <th>货品SPU-货品名称</th>
            <th>属性</th>
            <th>库位</th>
            <th>数量</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              000000000000001
              <div class="gray">1000M-</div>
            </td>
            <td>1000M-成品T恤</td>
            <td>
              <div>颜色：沙色</div>
              <div>尺码：One Size</div>
            </td>
            <td>仓1-001-A001</td>
            <td>2.000</td>
          </tr>
        </tbody>
      </table>
      <div class="footer">打印时间：2025-12-15 15：55：00（陈平安）</div>
    </div>
  </div>
</body>
</html>
