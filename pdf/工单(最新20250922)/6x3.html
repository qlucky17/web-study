<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生产工单6*3</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font: 400 19px/1 'PingFang SC', 'Microsoft Yahei', sans-serif;
      overflow: hidden;
    }

    .page {
      page-break-after: always;
      width: 500px;
      height: 250px;
      margin: 0 auto;
    }

    .wrapper,
    table,
    tr,
    td,
    th,
    tbody,
    thead,
    tfoot {
      page-break-inside: avoid !important;
    }

    .content-item {
      width: 500px;
      height: 250px;
      position: relative;
    }

    .relative {
      position: relative;
    }

    .nowrap {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .red {
      color: rgb(245, 63, 63);
    }

    .tr {
      text-align: right;
    }

    .fr {
      float: right;
    }

    .left {
      position: absolute;
      top: 0;
      left: 0;
    }

    .left img {
      width: 250px;
      height: 250px;
    }

    .left .tag {
      position: absolute;
      top: 0;
      left: 0;
    }

    .left .left_bottom {
      position: absolute;
      top: auto;
      bottom: 0;
    }

    .left .tag,
    .left .left_bottom_tag {
      display: inline-block;
      line-height: 27px;
      padding: 0 6px;
      background-color: rgb(245, 63, 63);
      color: #fff;
    }

    .left .bg_blue {
      background-color: rgb(0, 81, 248);
    }

    .left .bg_orange {
      background-color: rgb(254, 152, 32);
    }

    .left .tag.gray {
      top: 36px;
    }

    .left .tag.biao {
      left: auto;
      right: 0;
      background-color: #fff;
      border: 1px solid #0453F3;
      color: #0453F3;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      padding: 0;
      text-align: center;
    }

    .left .tag.bu {
      top: 97px;
      left: -33px;
      background-color: transparent;
    }

    .left .tag.bu img {
      width: 87px;
      height: 87px;
    }

    .left .left_bottom_tag.urgent {
      background-color: rgb(245, 63, 63);
    }

    .left .left_bottom_tag.y2 {
      background-color: rgb(46, 116, 255);
    }

    .right {
      width: 245px;
      padding-left: 250px;
    }

    .right-pd {
      padding-left: 8px;
    }

    .line-1 {
      position: relative;
      font-size: 24px;
    }

    .line-1 .type {
      display: inline-block;
      min-width: 20px;
      height: 20px;
      box-sizing: border-box;
      position: relative;
    }

    .line-1 svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
    }

    .line-1 .platform {
      position: absolute;
      right: 0;
      top: 0;
      font-weight: bold;
    }

    .line-2 {
      position: relative;
      font-size: 24px;
      font-weight: bold;
      margin-top: 2px;
    }

    .line-2 .code {
      position: absolute;
      right: 0;
      top: 4px;
      font-weight: normal;
      font-size: 18px;
    }

    .line-3 {
      margin-top: 6px;
      position: relative;
    }

    .qr-code {
      position: absolute;
      top: 0;
      left: 0;
    }

    .qr-code.color1 {
      background: rgb(71, 45, 86);
    }

    .qr-code.color2 {
      background: rgb(135, 72, 31);
    }

    .qr-code.color3 {
      background: rgb(16, 43, 106);
    }

    .qr-code.color4 {
      background: rgb(35, 24, 21);
    }

    .qr-code img {
      width: 88px;
      height: 88px;
      mix-blend-mode: color-dodge;
    }

    .cz-info {
      width: 100%;
      padding-left: 92px;
    }

    .cz-info>div {
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
    }

    .appname {
      margin-top: 4px;
    }

    .line-time {
      line-height: 22px;
    }

    .line-time .txt {
      overflow: hidden;
    }

    .line-4 {
      margin-top: 4px;
    }

    .line-4 .txt {
      max-width: 140px;
    }

    .line-5,
    .line-6 {
      margin-top: 1px;
    }

    .line-5 .txt {
      max-width: 180px;
    }

    .line-6 .fr {
      max-width: 180px;
      overflow: hidden;
      white-space: nowrap;
    }

    .line-6 .blg {
      display: inline-block;
      padding: 0 2px;
    }

    .time {
      display: inline-block;
      line-height: 22px;
      padding: 0 2px;
      background-color: rgb(102, 102, 102);
      color: #fff;
    }

    .time.week1 {
      background-color: rgb(170, 33, 22);
    }

    .time.week2 {
      background-color: rgb(245, 130, 32);
    }

    .time.week3 {
      background-color: rgb(119, 120, 123);
    }

    .time.week4 {
      background-color: rgb(0, 88, 49);
    }

    .time.week5 {
      background-color: rgb(34, 75, 143);
    }

    .time.week6 {
      background-color: rgb(139, 0, 139);
    }

    .time.week7 {
      background-color: rgb(35, 24, 21);
    }

    .time.week1.even {
      background-color: rgb(132, 57, 0);
    }

    .time.week2.even {
      background-color: rgb(252, 175, 23);
    }

    .time.week3.even {
      background-color: rgb(161, 163, 166);
    }

    .time.week4.even {
      background-color: rgb(29, 149, 63);
    }

    .time.week5.even {
      background-color: rgb(16, 43, 106);
    }

    .time.week6.even {
      background-color: rgb(65, 20, 69);
    }

    .time.week7.even {
      background-color: rgb(62, 65, 69);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="wrapper">
      <div class="content-item">
        <div class="left">
          <img
            src="/data/docker/production-scheduler/2025/09/18/p_work_order/750646999166051584/work/750600016183256320_1.jpeg" />
          <div class="tag ">A/2P</div>
          <div class="tag gray">灰</div>
          <div class="tag biao">标</div>
          <div class="tag bu">
            <img src="" />
          </div>
          <div class="left_bottom">
            <span class="left_bottom_tag urgent">急</span>
            <span class="left_bottom_tag y2">Y2</span>
          </div>
        </div>
        <div class="right">
          <div class="right-pd">
            <div class="line-1">
              <span>12H</span>
              <span class="type"><svg viewBox="0 0 100 100" preserveAspectRatio="xMinYMin meet">

            <div class="line-2">

            </div>
            <div class="line-3">
              <div class="qr-code">

              </div>
              <div class="cz-info">
                <div>1000M--1000M</div>

              </div>
              <div class="tr">
                <div class="total">总:2件</div>
                <div class="appname nowrap">商户名称</div>
              </div>
            </div>
          </div>
          <div class="line-time line-4">
            <div class="time week4">09-18-013</div>
            <div class="fr txt">7781736425778</div>
          </div>
          <div class="line-time line-5">
            <div class="time week4">09-18</div>
            <div class="fr txt">ZxIshop_#NVZRA5Y</div>
          </div>
          <div class="line-time line-6">
            <div class="time week4">09-18</div>
            <div class="fr">
              <span>05543</span>
              <span class="blg" style="background: #e31e1e; color: #1c1a1a;">0USPS</span>
              <span>01056</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
